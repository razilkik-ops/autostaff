server {
    listen 159.194.234.145:80;
    server_name 159.194.234.145.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sgcb-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 159.194.234.145:443 ssl;
    server_name 159.194.234.145.sslip.io;

    ssl_certificate /etc/letsencrypt/live/159.194.234.145.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159.194.234.145.sslip.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
