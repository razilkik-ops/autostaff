name: Node.js CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgcb_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sgcb_store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sgcb_store?schema=public
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: Integration-Admin-2026!
      ADMIN_NAME: CI Administrator
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npm run db:migrate && npm run db:seed

      - name: Validate and test
        run: npm run build && npm run check
